# Release pipeline for hexo-tag-cloud, triggered by a `vX.Y.Z` tag push.
#
#   validate-release-tag → publish-npm ─┬→ publish-github-release
#                                        └→ publish-github-packages
#
# Pre-flight (manual, before tagging):
#   1. Bump `version` in `package.json` to match the tag.
#   2. Merge to master, wait for the Tests run on that commit to pass, then
#      create and push the `vX.Y.Z` tag on that exact commit.
#
# There is no CHANGELOG file: the GitHub Release notes generated below are
# the changelog.
#
# The release never re-runs the test suite: it requires the exact master
# commit to already have a successful Tests run, so what ships is what CI
# verified. Release notes list the issues closed by commits/PRs in the range
# (scripts/release-issues.py) and every commit since the previous tag
# (scripts/release-notes.sh).
#
# npm auth: Trusted Publishing via OIDC (npmjs.com → package → Trusted
# Publishers → GitHub Actions → D0n9X1n/hexo-tag-cloud, workflow release.yml).
# No long-lived NPM_TOKEN secret. Pre-release tags (`v3.1.0-rc.1`) publish
# under the `next` dist-tag and are marked as GitHub pre-releases.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Read-only by default. Each job re-grants only what it needs, so the job that
# talks to npm cannot write the repo and the job that writes the GitHub
# Release cannot publish to npm.
permissions:
  contents: read

# Never cancel a half-completed publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-tag:
    name: Validate release provenance and source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release commit is on master
        run: |
          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master

      - name: Verify exact successful master Tests run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?branch=master&event=push&status=success&head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .conclusion == "success")] | length')"
          if [ "$count" -lt 1 ]; then
            echo "::error::No successful Tests run on master for ${GITHUB_SHA}; wait for CI before tagging."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Verify tarball contents
        run: node build/verify-pack.js

      - name: Test release tooling
        run: bash scripts/test-release-notes.sh

  publish-npm:
    name: Publish ${{ github.ref_name }} to npm
    runs-on: ubuntu-latest
    needs: [validate-release-tag]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        # Node 20 ships with npm 10.x; trusted publishing needs >= 11.5.1.
        run: npm install -g npm@^11

      - name: Publish (skips a version that is already on npm)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if npm view "hexo-tag-cloud@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::hexo-tag-cloud@${VERSION} is already on npm; skipping publish."
            exit 0
          fi
          DIST_TAG=latest
          case "$VERSION" in *-*) DIST_TAG=next ;; esac
          npm publish --provenance --access public --tag "$DIST_TAG"

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm]
    # The only job that writes to the repository: it creates the Release.
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate release notes (resolved issues + commits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-notes.sh "${{ github.ref_name }}" > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: hexo-tag-cloud ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Mirror to GitHub Packages as @d0n9x1n/hexo-tag-cloud so the repository's
  # Packages sidebar lists it. Runs only behind the same gates as npm.
  publish-github-packages:
    name: Mirror ${{ github.ref_name }} to GitHub Packages
    runs-on: ubuntu-latest
    needs: [publish-npm]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@d0n9x1n'

      - name: Upgrade npm for provenance
        run: npm install -g npm@^11

      - name: Publish scoped mirror (skips an existing version)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if npm view "@d0n9x1n/hexo-tag-cloud@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@d0n9x1n/hexo-tag-cloud@${VERSION} already mirrored; skipping."
            exit 0
          fi
          # GitHub Packages requires the scope to match the repo owner. The
          # runner is ephemeral; this rewrite is never committed.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@d0n9x1n/hexo-tag-cloud';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com', access: 'public' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          node build/verify-pack.js
          DIST_TAG=latest
          case "$VERSION" in *-*) DIST_TAG=next ;; esac
          npm publish --provenance --access public --tag "$DIST_TAG"
